{{ define "main" }}
  <article class="markdown book-article">
    {{ .Content }}
    
    <h1>Índice de Conteúdos</h1>
    
    <div class="cards-grid">
      {{ range .Site.RegularPages }}
        <a href="{{ .RelPermalink }}" class="card">
          <h3>{{ .Title | default (.File.BaseFileName | humanize | title) }}</h3>
          <p>Aceder ao write-up →</p>
        </a>
      {{ end }}
    </div>
  </article>

  <style>
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .card {
      border: 1px solid #333;
      border-radius: 6px;
      padding: 1.5rem;
      text-decoration: none !important;
      color: inherit;
      background: #1a1a1a;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #4CAF50; 
    }
    .card h3 {
      margin: 0 0 1rem 0;
      font-size: 1.1rem;
      color: #e0e0e0;
    }
    .card p {
      margin: auto 0 0 0;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
{{ end }}
